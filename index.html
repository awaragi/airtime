<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Airtime">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Airtime</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f6f9;
    --idle: #e6eaf0;
    --text: #151a21;
    --muted: #5d6773;
    --line: #c3cad3;
    --a: #2563eb;
    --b: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418;
      --idle: #1a1f26;
      --text: #e8ecf1;
      --muted: #7d8794;
      --line: var(--line);
      --a: #3b82f6;
      --b: #f59e0b;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  /* Fixed stacked layout (one wide panel on top of the other) that scales with the window (resize freely) rather than reflowing. */
  body { min-width: 160px; min-height: 320px; }
  #app { display: grid; grid-template-rows: 1fr 1fr; height: 100%; gap: 2px; }
  .side { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--idle); cursor: pointer; user-select: none; -webkit-user-select: none;
    transition: background .15s; padding: 2vmin; container-type: size; }
  .side[data-who="a"] { --c: var(--a); }
  .side[data-who="b"] { --c: var(--b); }
  .side.active { background: color-mix(in srgb, var(--c) 28%, var(--idle)); box-shadow: inset 0 0 0 4px var(--c); }
  .time { color: var(--c); font-variant-numeric: tabular-nums; font-size: min(30cqw, 48cqh); font-weight: 700; line-height: 1.1; white-space: nowrap; }
  .share { font-size: min(9cqw, 10cqh); color: var(--muted); margin-top: 1cqh; }
  body { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  dialog { background: var(--idle); color: var(--text); border: 1px solid var(--line); border-radius: 16px; padding: 24px; max-width: 90vw; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog p { margin: 0 0 20px; font-size: 1.1rem; text-align: center; }
  dialog .row { display: flex; gap: 12px; justify-content: center; }
  dialog button { background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 999px;
    padding: 10px 22px; font-size: 1rem; cursor: pointer; }
  dialog p.refresh { margin: 16px 0 0; }
  dialog p.refresh button { border: 0; color: var(--muted); font-size: .9rem; }
  dialog button.danger { background: #dc2626; border-color: #dc2626; }
</style>
</head>
<body>
<div id="app">
  <div class="side" data-who="a" id="sideA">
    <div class="time" id="timeA">0:00</div>
    <div class="share" id="shareA">0%</div>
  </div>
  <div class="side" data-who="b" id="sideB">
    <div class="time" id="timeB">0:00</div>
    <div class="share" id="shareB">0%</div>
  </div>
</div>
<dialog id="resetDlg">
  <p>Reset both timers?</p>
  <div class="row">
    <button id="cancelBtn" type="button">Cancel</button>
    <button id="confirmBtn" class="danger" type="button">Reset</button>
  </div>
  <p class="refresh"><button id="refreshBtn" type="button">Refresh app</button></p>
</dialog>

<script>
(() => {
  const KEY = "airtime:v1";
  const who = ["a", "b"];
  const el = {};
  for (const w of who) {
    el[w] = { side: document.getElementById("side" + w.toUpperCase()), 
      time: document.getElementById("time" + w.toUpperCase()), share: document.getElementById("share" + w.toUpperCase()) };
  }
  // state: ms accumulated per side, which side is running (null = paused), and when it started.
  let st = { ms: { a: 0, b: 0 }, active: null, since: 0, last: "a" };

  try { const saved = JSON.parse(localStorage.getItem(KEY)); if (saved && saved.ms) st = { ...st, ...saved }; } catch (e) {}

  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
  const elapsed = (w) => st.ms[w] + (st.active === w ? Date.now() - st.since : 0);

  function fmt(ms) {
    const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    const p = (n) => String(n).padStart(2, "0");
    return h ? `${h}:${p(m)}:${p(sec)}` : `${m}:${p(sec)}`;
  }

  function stop() {
    if (st.active) { st.ms[st.active] += Date.now() - st.since; st.last = st.active; st.active = null; }
  }
  function start(w) {
    if (st.active === w) return;
    stop();
    st.active = w; st.since = Date.now();
    wake();
  }
  function toggleSide(w) { st.active === w ? stop() : start(w); render(); save(); }
  function switchOther() {
    // Space / one-click switch: flip to the other side; if paused, resume with the side opposite the last one that ran.
    const next = st.active ? (st.active === "a" ? "b" : "a") : (st.last === "a" ? "b" : "a");
    start(next); render(); save();
  }

  function render() {
    const a = elapsed("a"), b = elapsed("b"), tot = a + b;
    const ms = { a, b };
    for (const w of who) {
      el[w].time.textContent = fmt(ms[w]);
      el[w].share.textContent = tot ? Math.round((ms[w] / tot) * 100) + "%" : "0%";
      el[w].side.classList.toggle("active", st.active === w);
    }
    document.title = st.active ? `${fmt(ms[st.active])}` : "Airtime";
  }

  // Screen wake lock: keep the display on whenever the app is open (running or paused).
  // The browser drops the lock when the page is hidden, so re-acquire on return and on any interaction.
  let lock = null;
  async function wake() {
    try {
      if (!("wakeLock" in navigator) || lock || document.visibilityState !== "visible") return;
      lock = await navigator.wakeLock.request("screen");
      lock.addEventListener("release", () => (lock = null));
    } catch (e) { lock = null; }
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { wake(); render(); } });
  for (const ev of ["pointerdown", "keydown"]) document.addEventListener(ev, wake);

  for (const w of who) {
    el[w].side.addEventListener("click", () => toggleSide(w));
  }
  // Long press (3s) anywhere opens the reset confirmation. Pointer events cover mouse, touch and pen.
  const dlg = document.getElementById("resetDlg");
  let pressTimer = null, pressX = 0, pressY = 0, swallowClick = false;
  const cancelPress = () => { clearTimeout(pressTimer); pressTimer = null; };
  document.addEventListener("pointerdown", (e) => {
    swallowClick = false;
    if (dlg.open) return;
    pressX = e.clientX; pressY = e.clientY;
    pressTimer = setTimeout(() => { pressTimer = null; swallowClick = true; dlg.showModal(); }, 3000);
  });
  document.addEventListener("pointermove", (e) => { if (pressTimer && Math.hypot(e.clientX - pressX, e.clientY - pressY) > 12) cancelPress(); });
  for (const ev of ["pointerup", "pointercancel"]) document.addEventListener(ev, cancelPress);
  document.addEventListener("contextmenu", (e) => e.preventDefault());
  // The release that ends a long press must not also toggle a side.
  document.addEventListener("click", (e) => { if (swallowClick && !dlg.contains(e.target)) { swallowClick = false; e.stopPropagation(); e.preventDefault(); } }, true);
  document.getElementById("cancelBtn").addEventListener("click", () => dlg.close());
  document.getElementById("confirmBtn").addEventListener("click", () => {
    st.ms = { a: 0, b: 0 }; st.active = null; st.last = "a"; render(); save(); dlg.close();
  });
  // Force-refresh for installed copies: drop the service worker and caches, then reload from the network.
  document.getElementById("refreshBtn").addEventListener("click", async () => {
    dlg.close();
    try {
      for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
      for (const k of await caches.keys()) await caches.delete(k);
    } catch (e) {}
    location.reload();
  });
  dlg.addEventListener("close", () => { swallowClick = false; });
  document.addEventListener("keydown", (e) => {
    if (dlg.open) return;
    if (e.code === "Space") { e.preventDefault(); switchOther(); }
    else if (e.code === "ArrowLeft") { start("a"); render(); save(); }
    else if (e.code === "ArrowRight") { start("b"); render(); save(); }
  });

  // A tab that was open while running keeps its start time, so a reload resumes correctly.
  render(); wake();
  setInterval(render, 200);
})();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
